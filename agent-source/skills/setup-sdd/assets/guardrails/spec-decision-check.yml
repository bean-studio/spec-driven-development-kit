name: Spec decision check

# Copy to .github/workflows/ and adapt the four values below. This is a blunt
# backstop: path presence and a PR rationale cannot prove decision quality.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-moves-with-code:
    runs-on: ubuntu-latest
    steps:
      - name: Check decision evidence
        uses: actions/github-script@v7
        with:
          script: |
            const implementationPrefixes = ['src/'];
            const decisionPrefixes = ['specs/'];
            const decisionFiles = ['ARCHITECTURE.md'];
            const noDecisionEditLabel = 'no-decision-edit';

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100 }
            );
            const names = files.map(file => file.filename);
            const implementationChanged = names.some(name =>
              implementationPrefixes.some(prefix => name.startsWith(prefix))
            );
            const decisionChanged = names.some(name =>
              decisionPrefixes.some(prefix => name.startsWith(prefix)) ||
              decisionFiles.includes(name)
            );

            if (!implementationChanged || decisionChanged) {
              core.info('Decision path check passed.');
              return;
            }

            const labels = (context.payload.pull_request.labels || []).map(label => label.name);
            const body = context.payload.pull_request.body || '';
            const hasLabel = labels.includes(noDecisionEditLabel);
            const field = label => {
              const match = body.match(new RegExp(`${label}:\\s*([^\\r\\n]+)`, 'i'));
              return match ? match[1].trim() : '';
            };
            const meaningful = value => value && value !== 'not-applicable';
            const reason = field('No-decision reason');
            const hasExplicitClause =
              reason === 'explicit-spec-drift' && meaningful(field('Existing clause'));
            const hasMechanicalRationale =
              reason === 'mechanical-tooling' && meaningful(field('Rationale'));

            if (!hasLabel || hasExplicitClause === hasMechanicalRationale) {
              core.setFailed(
                'Implementation changed without a decision-file change. Apply the configured label and provide exactly one cited explicit-spec clause or mechanical/tooling rationale in the PR body.'
              );
              return;
            }

            core.info('Accepted one no-decision-edit rationale.');
